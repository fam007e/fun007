# ==============================================================================
# MPV CONFIGURATION FOR INTEL IRIS XE (TIGER LAKE)
# Optimized for: i5-1135G7 + Iris Xe Graphics
# ==============================================================================

# ===== Video Output & API =====
vo=gpu-next                 # Modern renderer with best Vulkan support
gpu-api=vulkan              # Iris Xe excels with Vulkan on Mesa
hwdec=vaapi                 # Native Intel hardware decoding

# ===== Screenshots =====
screenshot-directory="~/Pictures/Screenshots"
screenshot-format=png
screenshot-template="%F-%P"

# ===== Vulkan Performance =====
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=1

# ===== Scaling & Quality =====
scale=ewa_lanczos
cscale=spline36
dscale=mitchell
correct-downscaling=yes
linear-downscaling=no
sigmoid-upscaling=yes
dither-depth=auto

# ===== Motion Interpolation =====
video-sync=display-resample
interpolation=yes
tscale=oversample

# ===== Debanding =====
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4

# ===== General & Performance =====
idle=yes
ytdl-format="bestvideo[height<=?1080]+bestaudio/best"
autofit=45%
border=yes
msg-color=yes
msg-module=yes
keep-open=yes
save-position-on-quit=yes

# ===== Cache =====
cache=yes
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=150MiB

# ===== OSD (User Preferences) =====
osc=no
keepaspect-window=no
osd-font='Fira Sans'
osd-font-size=22
osd-scale=0.70
osd-on-seek=msg
osd-bar=no
osd-color="#d8dee9"          # Nord4 (Light Gray)
osd-border-color="#242933"   # Custom (Near-black)
osd-border-size=2

# ===== Subtitles (User Preferences) =====
blend-subtitles=yes 
sub-font='Vazir Bold'
sub-font-size=52
sub-margin-y=33
sub-color="#eceff4"          # Nord6 (Crisp White)
sub-border-size=2
sub-border-color="#242933"   # Custom (Near-black)
sub-blur=0.5
sub-shadow-offset=2
sub-shadow-color="#33000000"

# ===== Audio =====
audio-channels=stereo
volume=100

# ===== Color Management =====
target-trc=auto

# ==============================================================================
# CONDITIONAL PROFILES
# ==============================================================================

[UHD]
profile-desc=4K UHD Content
profile-cond=width >= 2560 and height >= 1440
glsl-shaders-clr
scale=hermite

[HighFPS]
profile-desc=High Framerate Content
profile-cond=(p["estimated-vf-fps"] > 31)
interpolation=no

[HDR]
profile-cond=p["video-params/primaries"] == "bt.2020"
tone-mapping=bt.2446a
vo=gpu-next
