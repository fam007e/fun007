#### ------- Mpv-Playlistmanager configuration ------- ####
# Nord Themed Playlist Manager

dynamic_binds=yes
key_showplaylist=SHIFT+ENTER
key_moveup=UP
key_movedown=DOWN
key_playfile=ENTER
key_removefile=BS
key_closeplaylist=ESC SHIFT+ENTER

# Appearance
# Gray: &HE9DED8& (#d8dee9)
# Base: &H332924& (#242933)
# White: &HF4EFEC& (#eceff4)
# Blue:  &HC1A181& (#81a1c1)

style_ass_tags={\\q2\\an7\\fs25\\c&HE9DED8&\\3c&H332924&\\bord1.5}
text_padding_x=30
text_padding_y=60

# Playlist file templates
# Use Nord Blue for headers and highlighted items
playlist_header={\\c&HC1A181&\\b1}Playlist [%cursor/%plen]

normal_file=○ %name
# Hovered item uses White
hovered_file={\\c&HF4EFEC&\\b1}● %name
# Selected item uses Blue
selected_file={\\c&HC1A181&\\b1}➔ %name
# Playing item uses Blue
playing_file={\\c&HC1A181&}▷ %name
playing_hovered_file={\\c&HF4EFEC&\\b1}▶ %name
playing_selected_file={\\c&HC1A181&\\b1}➤ %name

display_osd_feedback=yes
