# file-browser.conf
# Nord Themed File Browser

# root directories
root=~/Videos
default_to_working_directory=no

# Nord Color Palette (BGR format for ASS)
# Gray: &HE9DED8& (#d8dee9)
# Base: &H332924& (#242933)
# White: &HF4EFEC& (#eceff4)
# Blue:  &HC1A181& (#81a1c1)
# Dark:  &H52423B& (#3b4252)

# Styling
font_size_header=36
font_size_body=24
font_size_wrappers=18

# Colors
# Headers use Nord Blue
font_colour_header=C1A181
# Body uses Light Gray
font_colour_body=D8DEE9
# Wrappers (footer) use Blue
font_colour_wrappers=81A1C1
# Cursor uses Crisp White
font_colour_cursor=ECEFF4
# Selected/Multiselect uses Blue
font_colour_selected=81A1C1
font_colour_multiselect=81A1C1
# Playing file uses Blue
font_colour_playing=81A1C1
