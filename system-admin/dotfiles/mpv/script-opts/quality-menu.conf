# quality-menu.conf
# Nord Themed Layout for YouTube/Online streams

# Columns to display
columns_video=-resolution,language,bitrate_total,size,-codec_video
columns_audio=audio_sample_rate,bitrate_total,language,-codec_audio

# Nord Color Palette (BGR format for ASS)
# Gray: &HE9DED8& (#d8dee9)
# Base: &H332924& (#242933)
# White: &HF4EFEC& (#eceff4)

# Appearance
style_ass_tags={\\fnmonospace\\fs25\\bord1.5\\c&HE9DED8&\\3c&H332924&}

# Use colors in the selection markers for better focus
selected_and_active={\\c&HF4EFEC&}▶  
selected_and_inactive={\\c&HF4EFEC&}●  
unselected_and_active={\\c&HE9DED8&}▷ 
unselected_and_inactive={\\c&HE9DED8&}○ 

# Deduplication at the data level
fetch_formats=no

quality_strings_video=[ {"2160p AV1"  : "bestvideo[height<=2160][vcodec^=av01]"}, {"2160p AVC"  : "bestvideo[height<=2160][vcodec^=avc1]"}, {"1080p 60fps": "bestvideo[height<=1080][fps>50]"}, {"1080p AV1"  : "bestvideo[height<=1080][vcodec^=av01]"}, {"1080p AVC"  : "bestvideo[height<=1080][vcodec^=avc1]"}, {"1080p VP9"  : "bestvideo[height<=1080][vcodec^=vp9]"}, {"720p 60fps" : "bestvideo[height<=720][fps>50]"}, {"720p"       : "bestvideo[height<=720]"}, {"480p"       : "bestvideo[height<=480]"}, {"360p"       : "bestvideo[height<=360]"} ]

quality_strings_audio=[ {"Best Audio" : "bestaudio"}, {"High Quality (Opus)" : "bestaudio[acodec=opus]"}, {"Compatibility (m4a)" : "bestaudio[ext=m4a]"}, {"Low Data" : "worstaudio"} ]

# Quality sorting
sort_video=height,fps,tbr,size,format_id
hide_identical_columns=no
