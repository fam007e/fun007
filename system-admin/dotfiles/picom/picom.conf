#====================================================#
#  picom.conf — Optimized for Intel Iris Xe (TGL)    #
#====================================================#

#--- Backend ---#
# EGL is native for Intel Mesa (iris driver); avoids GLX translation overhead
backend = "egl";

#--- VSync & Presentation ---#
vsync = true;
dithered-present = false;

#--- Performance & Damage Tracking ---#
use-damage = true;
unredir-if-possible = true;
unredir-if-possible-delay = 1000;

#--- Shadows ---#
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

#--- Fading ---#
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

#--- Opacity ---#
frame-opacity = 1.0;

#--- Corners ---#
corner-radius = 0;

#--- Detection ---#
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

#--- Animations (Native Picom v13 System) ---#
animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 0.95;
    duration = 0.15;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.95;
    duration = 0.12;
  },
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.15;
  }
);

#--- Window Rules ---#
rules: ({
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.75;
  full-shadow = false;
}, {
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  match = "window_type = 'dock' || "
          "window_type = 'desktop'";
  corner-radius = 0;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
}, {
  match = "class_g = 'dwm'";
  corner-radius = 0;
}, {
  match = "class_g = 'Rofi'";
  corner-radius = 24;
})
